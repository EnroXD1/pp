<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>❤️❤️❤️❤️❤️❤️</title>
  <style>
    :root{
      --bg1:#0f172a; --bg2:#071129; --accent:#7c3aed; --glass: rgba(255,255,255,0.06);
      --glass-2: rgba(255,255,255,0.03);
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    html,body{height:100%;margin:0;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:#e6eef8}
    .wrap{min-height:100vh;display:grid;place-items:center;padding:48px}

    .card{
      width:min(1000px,94vw);height:min(640px,78vh);position:relative;overflow:hidden;border-radius:20px;
      box-shadow: 0 10px 40px rgba(2,6,23,0.6);backdrop-filter: blur(6px);background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.04);display:grid;grid-template-columns:1fr 360px;
    }

    /* Left: canvas area */
    .stage{position:relative;padding:28px 20px}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

    /* Right: controls & text */
    .sidebar{padding:28px;display:flex;flex-direction:column;gap:16px;align-items:flex-start}
    h1{margin:0;font-size:22px;letter-spacing:-0.02em}
    p{margin:0.25rem 0 0;color:rgba(230,238,248,0.8);font-size:14px}

    .controls{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
    .btn{background:var(--glass);border:1px solid rgba(255,255,255,0.04);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600}

    .range{width:100%}
    label{font-size:12px;color:rgba(230,238,248,0.7)}

    /* floating blobs */
    .blob{position:absolute;width:380px;height:380px;filter:blur(46px);opacity:0.16;border-radius:50%;transform:translate(-20%,-20%);pointer-events:none}
    .b1{background:radial-gradient(circle at 30% 30%, #ff7ab6, #7c3aed);left:-6%;top:-10%}
    .b2{background:radial-gradient(circle at 70% 70%, #00e6d6, #00a3ff);right:-10%;bottom:-14%}

    footer{position:absolute;left:18px;bottom:14px;font-size:12px;color:rgba(230,238,248,0.6)}

    /* small responsive */
    @media (max-width:880px){
      .card{grid-template-columns:1fr; height:min(720px,80vh)}
      .sidebar{order:2;width:100%;padding:18px}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="stage">
        <canvas id="c"></canvas>
        <div class="blob b1"></div>
        <div class="blob b2"></div>
        <footer>Наведите мышь — частицы откликнутся ✨</footer>
      </div>

      <div class="sidebar">
        <div>
          <h1>Ууу, частички ❤️</h1>
          <p>Привет, а что ты тут делаешь?</p>
        </div>

        <div style="width:100%;">
          <label>Количество частиц: <span id="countLbl">120</span></label>
          <input id="count" class="range" type="range" min="20" max="450" value="120" />
        </div>

        <div style="width:100%;">
          <label>Скорость: <span id="speedLbl">1.0</span></label>
          <input id="speed" class="range" type="range" min="0" max="300" value="100" />
        </div>

        <div class="controls">
          <button id="regen" class="btn">Перегенерировать</button>
          <button id="glow" class="btn">Вкл/Выкл свет</button>
          
        </div>

        <small style="color:rgba(230,238,248,0.6);margin-top:8px">Подсказка: Тут нет подсказки:)</small>
      </div>
    </div>
  </div>

  <script>
    // --- helpers
    const $ = sel => document.querySelector(sel);
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [], mouse = {x:-9999,y:-9999};

    function resize(){ W = canvas.width = canvas.clientWidth; H = canvas.height = canvas.clientHeight }
    window.addEventListener('resize', resize);

    // Particle class
    class P{
      constructor(){
        this.reset();
      }
      reset(){
        this.x = Math.random()*W; this.y = Math.random()*H;
        const a = Math.random()*Math.PI*2; this.vx = Math.cos(a); this.vy = Math.sin(a);
        this.size = 0.8 + Math.random()*2.6; this.hue = 180 + Math.random()*200; this.life = 40+Math.random()*240;
      }
      step(speed){
        // attraction to mouse
        const dx = mouse.x - this.x, dy = mouse.y - this.y; const d2 = dx*dx+dy*dy;
        if(d2 < 180000){
          const f = (1 - d2/180000) * 2.2;
          this.vx += (dx/ (Math.sqrt(d2)+40)) * f * 0.06;
          this.vy += (dy/ (Math.sqrt(d2)+40)) * f * 0.06;
        }
        this.x += this.vx * (speed/100);
        this.y += this.vy * (speed/100);
        this.vx *= 0.985; this.vy *= 0.985;
        this.life--;
        if(this.x<-50||this.x>W+50||this.y<-50||this.y>H+50||this.life<=0) this.reset();
      }
      draw(ctx, glow){
        ctx.beginPath();
        ctx.fillStyle = 'hsla('+ (this.hue + Math.sin(this.life/10)*30) +',80%,'+ (50 - this.size*6) +'%,'+ (0.75) +')';
        ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
        ctx.fill();
        if(glow){
          ctx.beginPath(); ctx.fillStyle = 'rgba(255,255,255,0.02)'; ctx.arc(this.x,this.y,this.size*6,0,Math.PI*2); ctx.fill();
        }
      }
    }

    function init(){
      resize();
      particles = [];
      const n = +$('#count').value;
      for(let i=0;i<n;i++) particles.push(new P());
    }

    // interaction
    canvas.addEventListener('mousemove', e=>{ const r = canvas.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; });
    canvas.addEventListener('mouseleave', ()=>{ mouse.x = -9999; mouse.y = -9999; });

    // UI
    $('#count').addEventListener('input', e=>{ $('#countLbl').textContent = e.target.value; init(); });
    $('#speed').addEventListener('input', e=>{ $('#speedLbl').textContent = (e.target.value/100).toFixed(2); });
    $('#regen').addEventListener('click', init);

    let glow = true;
    $('#glow').addEventListener('click', ()=>{ glow = !glow; document.querySelectorAll('.blob').forEach(b=>b.style.opacity = glow ? '0.16':'0.03'); });

    

    // render loop
    function tick(){
      ctx.clearRect(0,0,W,H);
      // soft trail
      ctx.fillStyle = 'rgba(2,6,23,0.18)'; ctx.fillRect(0,0,W,H);

      const speed = +$('#speed').value;
      for(let i=0;i<particles.length;i++){
        const p = particles[i]; p.step(speed);
        p.draw(ctx, glow);
      }

      // connecting lines
      for(let i=0;i<particles.length;i++){
        for(let j=i+1;j<particles.length;j++){
          const a = particles[i], b = particles[j];
          const dx = a.x-b.x, dy = a.y-b.y; const d2 = dx*dx+dy*dy;
          if(d2 < 9000){
            ctx.beginPath(); ctx.strokeStyle = 'rgba(255,255,255,'+ (0.03 - d2/30000) +')'; ctx.lineWidth = 0.6; ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
          }
        }
      }

      requestAnimationFrame(tick);
    }

    // start
    init(); tick();
  </script>
</body>
</html>
