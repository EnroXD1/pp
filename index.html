<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С 8 Марта, любимая!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: 'Marck Script', cursive, sans-serif;
            position: relative;
        }

        /* Пульсирующее сердце */
        .heart {
            position: absolute;
            width: 100px;
            height: 100px;
            background: red;
            transform: rotate(-45deg);
            animation: pulse 2s infinite ease-in-out;
        }

            .heart::before,
            .heart::after {
                content: "";
                position: absolute;
                width: 100px;
                height: 100px;
                background: red;
                border-radius: 50%;
            }

            .heart::before {
                top: -50px;
                left: 0;
            }

            .heart::after {
                top: 0;
                left: 50px;
            }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1) rotate(-45deg);
            }

            50% {
                transform: scale(1.2) rotate(-45deg);
            }
        }

        /* Контейнер с текстом */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            opacity: 0;
            transition: opacity 2s ease;
        }

        body[data-loaded="true"] .container {
            opacity: 1;
        }

        /* Анимации для текста */
        @keyframes appearAndScale {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes subtleBounce {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        /* Текст: «С 8 Марта, любимая!» */
        .title {
            font-size: 8em;
            font-weight: bold;
            margin-top: 20px;
            background: linear-gradient(90deg, #ffffff, #b5e0ff, #ffffff, #b5e0ff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: appearAndScale 3s forwards, subtleBounce 3s infinite 3s, gradientShift 6s ease infinite;
            opacity: 0;
            display: inline-block;
        }

        /* Дополнительный текст */
        .subtitle {
            font-size: 2.5em;
            margin-top: 20px;
            color: #fff;
            opacity: 0;
            animation: textFadeIn 2s ease-in-out forwards 2s;
        }

        /* Адаптация под мобильные устройства */
        @media (max-width: 768px) {
            .title {
                font-size: 5em;
            }

            .subtitle {
                font-size: 1.5em;
            }
        }

        /* Падающие лепестки роз */
        .petal {
            position: absolute;
            width: 20px;
            height: 20px;
            background: url('https://www.transparenttextures.com/patterns/rose-petal.png');
            background-size: cover;
            animation: fall 5s linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
            }

            100% {
                transform: translateY(100vh) rotate(360deg);
            }
        }

        /* Мерцающие звезды */
        .star {
            position: absolute;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            opacity: 0.8;
            animation: sparkleAnim 2s infinite ease-in-out;
        }

        @keyframes sparkleAnim {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.8;
            }

            50% {
                transform: translateY(-20px) scale(1.5);
                opacity: 1;
            }

            100% {
                transform: translateY(-40px) scale(1);
                opacity: 0;
            }
        }

        /* Анимация перехода текста */
        @keyframes textFadeIn {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in-text {
            animation: textFadeIn 2s ease-in-out forwards;
        }

        /* Солнце с эффектом свечения */
        .sun {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at center, #fff45c, #ffc500 80%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(255, 197, 0, 0.8);
            z-index: 1;
            opacity: 0;
            animation: sunFadeIn 2s forwards 1s;
        }

        @keyframes sunFadeIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) scale(0.5);
            }

            100% {
                opacity: 1;
                transform: translateX(-50%) scale(1);
            }
        }

        /* Эффект свечения вокруг солнца */
        .sun::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0) 70%);
            animation: glow 3s infinite ease-in-out;
        }

        @keyframes glow {
            0%, 100% {
                transform: scale(1);
                opacity: 0.8;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <!-- Пульсирующее сердце -->
    <div class="heart"></div>

    <!-- Контейнер с текстом -->
    <div class="container">
        <div class="title fade-in-text">С 8 Марта, любимая!</div>
        <div class="subtitle fade-in-text">Ты - мое солнце, моя радость и счастье! Пусть этот день принесет тебе море улыбок и тепла!</div>
    </div>

    <!-- Падающие лепестки роз -->
    <div class="petals"></div>

    <!-- Мерцающие звезды -->
    <div class="stars"></div>

    <!-- Солнце с эффектом свечения -->
    <div class="sun"></div>

    <script>
        window.onload = function () {
            // Показываем контейнер с текстом
            document.body.setAttribute('data-loaded', 'true');

            // Создаем падающие лепестки роз
            const petalsContainer = document.querySelector('.petals');
            for (let i = 0; i < 50; i++) {
                let petal = document.createElement('div');
                petal.classList.add('petal');
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = Math.random() * 3 + 2 + 's';
                petalsContainer.appendChild(petal);
            }

            // Создаем мерцающие звезды
            const starsContainer = document.querySelector('.stars');
            for (let i = 0; i < 150; i++) {
                let star = document.createElement('div');
                star.classList.add('star');
                star.style.left = Math.random() * 100 + 'vw';
                star.style.top = Math.random() * 100 + 'vh';
                star.style.animationDelay = Math.random() * 2 + 's';
                starsContainer.appendChild(star);
            }
        };
    </script>
</body>
</html>
